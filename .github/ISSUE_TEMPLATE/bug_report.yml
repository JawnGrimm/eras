name: Bug report
description: Report a reproducible problem in the application or repository.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Check existing issues first. For security vulnerabilities, do not use this form; see [SECURITY.md](../../SECURITY.md).
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the behavior you observed.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open...
        2. Select...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, operating system, device, and relevant version or commit, if known.
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots, logs, or other context
      description: Remove private or sensitive information before posting.
